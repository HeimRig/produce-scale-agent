<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" width="920" height="500" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="920" height="500" fill="#ffffff"/>

  <text x="24" y="38" font-size="20" font-weight="700" fill="#1f2328">Produce Agent · 一次结账的闭环</text>
  <text x="24" y="62" font-size="13" fill="#6b7280">perception → decision → action，Pi 5 上闭环预算约 1.2 秒（语音异步不计入）</text>

  <!-- pipeline -->
  <g>
    <rect x="24" y="92" width="112" height="64" rx="10" fill="#eef4fb" stroke="#9db8d6"/>
    <text x="80" y="120" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">拍照</text>
    <text x="80" y="139" font-size="11" fill="#5b6b7c" text-anchor="middle">picamera2</text>

    <rect x="152" y="92" width="132" height="64" rx="10" fill="#eef4fb" stroke="#9db8d6"/>
    <text x="218" y="120" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">识别</text>
    <text x="218" y="139" font-size="11" fill="#5b6b7c" text-anchor="middle">MobileNetV3 · ONNX</text>

    <rect x="300" y="92" width="104" height="64" rx="10" fill="#eef4fb" stroke="#9db8d6"/>
    <text x="352" y="120" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">查价</text>
    <text x="352" y="139" font-size="11" fill="#5b6b7c" text-anchor="middle">prices.json</text>

    <rect x="420" y="92" width="112" height="64" rx="10" fill="#eef4fb" stroke="#9db8d6"/>
    <text x="476" y="120" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">称重</text>
    <text x="476" y="139" font-size="11" fill="#5b6b7c" text-anchor="middle">HX711</text>

    <rect x="548" y="92" width="104" height="64" rx="10" fill="#eef7f0" stroke="#8ec4a3"/>
    <text x="600" y="120" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">计价</text>
    <text x="600" y="139" font-size="11" fill="#5b6b7c" text-anchor="middle">克 → 元</text>

    <rect x="668" y="92" width="104" height="64" rx="10" fill="#fdf3e8" stroke="#d9b483"/>
    <text x="720" y="120" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">播报</text>
    <text x="720" y="139" font-size="11" fill="#5b6b7c" text-anchor="middle">edge-tts</text>

    <rect x="788" y="92" width="108" height="64" rx="10" fill="#fdf3e8" stroke="#d9b483"/>
    <text x="842" y="120" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">打票</text>
    <text x="842" y="139" font-size="11" fill="#5b6b7c" text-anchor="middle">ESC/POS 58mm</text>
  </g>

  <!-- arrows -->
  <g stroke="#9aa4b1" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <line x1="138" y1="124" x2="148" y2="124"/>
    <line x1="286" y1="124" x2="296" y2="124"/>
    <line x1="406" y1="124" x2="416" y2="124"/>
    <line x1="534" y1="124" x2="544" y2="124"/>
    <line x1="654" y1="124" x2="664" y2="124"/>
    <line x1="774" y1="124" x2="784" y2="124"/>
  </g>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa4b1"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b7fa6"/>
    </marker>
  </defs>

  <!-- tool layer -->
  <rect x="24" y="204" width="872" height="76" rx="12" fill="#f6f8fa" stroke="#c9d3de"/>
  <text x="44" y="230" font-size="14" font-weight="700" fill="#1f2328">工具层 AgentTools · 唯一能力出口</text>
  <text x="44" y="256" font-size="12.5" fill="#4b5563">recognize　get_price　weigh　make_quote　speak　print_receipt　checkout</text>

  <g stroke="#5b7fa6" stroke-width="1.6" fill="none" marker-end="url(#b)">
    <line x1="218" y1="200" x2="218" y2="160"/>
    <line x1="476" y1="200" x2="476" y2="160"/>
    <line x1="720" y1="200" x2="720" y2="160"/>
  </g>

  <!-- consumers -->
  <g>
    <rect x="24" y="330" width="272" height="70" rx="10" fill="#ffffff" stroke="#c9d3de"/>
    <text x="160" y="358" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="middle">确定性状态机（主链路）</text>
    <text x="160" y="379" font-size="11.5" fill="#6b7280" text-anchor="middle">延迟 &lt; 5 ms，不做大模型推理</text>

    <rect x="316" y="330" width="272" height="70" rx="10" fill="#ffffff" stroke="#c9d3de"/>
    <text x="452" y="358" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="middle">LLM 语义路由（旁路）</text>
    <text x="452" y="379" font-size="11.5" fill="#6b7280" text-anchor="middle">本地量化模型 → API → 规则兜底</text>

    <rect x="608" y="330" width="288" height="70" rx="10" fill="#ffffff" stroke="#c9d3de"/>
    <text x="752" y="358" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="middle">MCP 服务（对外）</text>
    <text x="752" y="379" font-size="11.5" fill="#6b7280" text-anchor="middle">任何 Agent 都能直接调这台秤</text>
  </g>

  <g stroke="#6b7280" stroke-width="1.4" fill="none" marker-end="url(#a)">
    <line x1="160" y1="330" x2="160" y2="286"/>
    <line x1="452" y1="330" x2="452" y2="286"/>
    <line x1="752" y1="330" x2="752" y2="286"/>
  </g>

  <text x="24" y="442" font-size="12" fill="#6b7280">同一份能力被三处消费：加一个功能只改工具层，换 LLM 或换接入方式都不用动业务代码。</text>
  <text x="24" y="466" font-size="12" fill="#6b7280">视觉 2.5 ms/帧 · 端到端 107 ms（PC）· 实拍准确率 88.5% · 模型 6.39 MB</text>
</svg>
